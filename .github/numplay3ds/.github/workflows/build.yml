name: build-cia
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      TAG: latest
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y git curl zip build-essential python3 python3-pil python3-numpy python3-qrcode nodejs npm
          echo "--- what the image already has ---"
          ls /opt/devkitpro/libctru/lib/ 2>&1 | head
          which 3dsxtool smdhtool 2>&1
          if [ ! -f /opt/devkitpro/libctru/lib/libctru.a ] || ! which 3dsxtool smdhtool >/dev/null; then
            for i in 1 2 3 4; do
              dkp-pacman -Sy --noconfirm 3ds-dev && break
              echo "devkitPro server refused, retrying in 30s"
              sleep 30
            done
          fi
          test -f /opt/devkitpro/libctru/lib/libctru.a
          which 3dsxtool smdhtool

      - uses: actions/checkout@v5

      - name: NumPlay source (GPL-3.0)
        run: git clone --depth 1 https://github.com/Mason363/NumPlay NumPlay-main

      - name: Find the project folder
        run: |
          pwd
          ls -la
          F=$(find . -path ./NumPlay-main -prune -o -name build_native.py -print | head -1)
          if [ -z "$F" ]; then
            echo "tools/build_native.py not found - did the upload include the tools folder?"
            exit 1
          fi
          ROOT=$(cd "$(dirname "$F")/.." && pwd)
          echo "project folder: $ROOT"
          ls "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: makerom
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR
          make -C Project_CTR/makerom deps -j4
          make -C Project_CTR/makerom -j4
          cp Project_CTR/makerom/bin/makerom /usr/local/bin/

      - name: bannertool
        run: |
          git clone --depth 1 --recursive https://github.com/diasurgical/bannertool
          make -C bannertool -j4
          cp bannertool/output/linux-x86_64/bannertool /usr/local/bin/

      # Builds NumPlay and all 23 big apps. -k keeps going if one fails, so the others still get published.
      - name: Build (NumPlay and the 23 big apps)
        run: |
          cd "$ROOT"
          make -k -j2 NUMPLAY="$GITHUB_WORKSPACE/NumPlay-main" all || echo "BUILD_FAILED=1" >> "$GITHUB_ENV"

      - name: Gather the files and make a QR code for each
        run: |
          cd "$ROOT"
          make dist DIST="$GITHUB_WORKSPACE/dist" BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          ls -la "$GITHUB_WORKSPACE/dist"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Latest build
          files: dist/*

      - name: Report a failed build
        run: |
          if [ -n "$BUILD_FAILED" ]; then
            echo "Some apps did not build (the others were published). Open the Build step above and look for the first error."
            exit 1
          fi
